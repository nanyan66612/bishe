<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>用户注册</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Microsoft YaHei", sans-serif; }
        body { background-color: #f5f7fa; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 450px; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 0 20px rgba(0,0,0,0.08); }
        h1 { text-align: center; margin-bottom: 30px; color: #2c3e50; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 16px; }
        .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
        .teacher-code { display: none; }
        .submit-btn { width: 100%; padding: 15px; border: none; border-radius: 8px; background: #2ecc71; color: white; font-size: 18px; cursor: pointer; }
        .back-text { text-align: center; margin-top: 20px; }
        .back-text a { color: #4a90e2; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>用户注册</h1>
        <form method="post" action="{% url 'register' %}">
            {% csrf_token %}
            <div class="form-group">
                <label>用户名（10位数字）</label>
                <input type="text" name="username" pattern="\d{10}" maxlength="10" required>
            </div>
            <div class="form-group">
                <label>邮箱</label>
                <input type="email" name="email" required>
            </div>
            <div class="form-group">
                <label>密码（15位，含大小写、数字、特殊符号）</label>
                <input type="password" name="password" required>
            </div>
            <div class="form-group">
                <label>确认密码</label>
                <input type="password" name="confirm_password" required>
            </div>
            <div class="form-group">
                <label>注册身份</label>
                <select name="role" id="roleSelect">
                    <option value="student">学生</option>
                    <option value="teacher">教师</option>
                </select>
            </div>
            <div class="form-group teacher-code" id="teacherCodeBox">
                <label>教师验证码</label>
                <input type="text" name="teacher_code">
            </div>
            <button type="submit" class="submit-btn">注册</button>
        </form>
        <div class="back-text">
            <a href="{% url 'index' %}">返回登录</a>
        </div>
    </div>

    <script>
        const roleSelect = document.getElementById('roleSelect');
        const teacherCodeBox = document.getElementById('teacherCodeBox');
        roleSelect.onchange = () => {
            teacherCodeBox.style.display = roleSelect.value === 'teacher' ? 'block' : 'none';
        };
    </script>
{% if messages %}
<script>
    {% for msg in messages %}
        {% if msg.tags == 'success' %}
            alert("✅ 注册成功！\n{{ msg }}");
        {% else %}
            alert("❌ 注册失败：{{ msg }}");
        {% endif %}
    {% endfor %}
</script>
{% endif %}
</body>
</html>
