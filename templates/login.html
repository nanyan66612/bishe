<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>C语言在线练习系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Microsoft YaHei", sans-serif; }
        body { background-color: #f5f7fa; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 450px; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 0 20px rgba(0,0,0,0.08); position: relative; }
        .admin-link { position: absolute; top: 20px; right: 20px; font-size: 14px; color: #666; text-decoration: none; }
        .title { text-align: center; font-size: 32px; font-weight: bold; color: #2c3e50; margin: 40px 0; }
        .btn-group { display: flex; gap: 20px; margin-bottom: 30px; }
        .btn { flex: 1; padding: 15px; border: none; border-radius: 8px; background: #4a90e2; color: white; font-size: 18px; cursor: pointer; }
        .form-box { display: none; }
        .form-box.active { display: block; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 18px; }
        .form-group input { width: 100%; padding: 15px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
        .submit-btn { width: 100%; padding: 15px; border: none; border-radius: 8px; background: #2ecc71; color: white; font-size: 18px; cursor: pointer; }
        .register-text { text-align: center; margin-top: 25px; font-size: 16px; }
        .register-text a { color: #4a90e2; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <a href="{% url 'admin_login' %}" class="admin-link">管理员登录</a>
        <h1 class="title">C语言在线练习系统</h1>

        <div class="btn-group">
            <button class="btn" id="studentBtn">学生端登录</button>
            <button class="btn" id="teacherBtn">教师端登录</button>
        </div>

        <div class="form-box" id="studentForm">
            <form method="post" action="{% url 'login' %}">
                {% csrf_token %}
                <input type="hidden" name="role" value="student">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" name="username" required>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" name="password" required>
                </div>
                <button type="submit" class="submit-btn">学生登录</button>
            </form>
        </div>

        <div class="form-box" id="teacherForm">
            <form method="post" action="{% url 'login' %}">
                {% csrf_token %}
                <input type="hidden" name="role" value="teacher">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" name="username" required>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" name="password" required>
                </div>
                <button type="submit" class="submit-btn">教师登录</button>
            </form>
        </div>

        <div class="register-text">
            没有账号？<a href="{% url 'register' %}">立即注册</a>
        </div>
    </div>

    <script>
        const studentBtn = document.getElementById('studentBtn');
        const teacherBtn = document.getElementById('teacherBtn');
        const studentForm = document.getElementById('studentForm');
        const teacherForm = document.getElementById('teacherForm');

        studentBtn.onclick = () => {
            studentForm.classList.add('active');
            teacherForm.classList.remove('active');
        };
        teacherBtn.onclick = () => {
            teacherForm.classList.add('active');
            studentForm.classList.remove('active');
        };
    </script>
</body>
</html>
