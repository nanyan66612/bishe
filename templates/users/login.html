{% extends 'base.html' %}
{% block content %}
<style>
    .container {
        max-width: 500px;
        margin: 50px auto;
        text-align: center;
        position: relative;
    }
    .admin-login {
        position: absolute;
        top: -30px;
        right: 0;
        font-size: 12px;
    }
    h1 {
        color: #2c3e50;
        margin-bottom: 30px;
    }
    .tab-buttons button {
        padding: 10px 30px;
        margin: 0 10px;
        border: none;
        background: #3498db;
        color: white;
        border-radius: 4px;
        cursor: pointer;
    }
    .tab-buttons button.active {
        background: #2980b9;
    }
    .login-form {
        margin-top: 30px;
        display: none;
        text-align: left;
    }
    .login-form.active {
        display: block;
    }
    .form-group {
        margin-bottom: 15px;
    }
    .form-group label {
        display: block;
        margin-bottom: 5px;
    }
    .form-group input {
        width: 100%;
        padding: 8px;
        box-sizing: border-box;
    }
    .submit-btn {
        background: #2ecc71;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 4px;
        cursor: pointer;
    }
    .register-link {
        margin-top: 20px;
        font-size: 14px;
    }
</style>

<div class="container">
    <!-- 右上角 管理员登录 -->
    <div class="admin-login">
        <a href="/admin/login/">管理员登录</a>
    </div>

    <h1>C语言在线练习系统</h1>

    <div class="tab-buttons">
        <button id="studentBtn" class="active" onclick="showForm('student')">学生端登录</button>
        <button id="teacherBtn" onclick="showForm('teacher')">教师端登录</button>
    </div>

    <div id="studentForm" class="login-form active">
        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="form-group">
                <label>用户名：</label>
                <input type="text" name="username" required>
            </div>
            <div class="form-group">
                <label>密码：</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="submit-btn">登录</button>
        </form>
    </div>

    <div id="teacherForm" class="login-form">
        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="form-group">
                <label>用户名：</label>
                <input type="text" name="username" required>
            </div>
            <div class="form-group">
                <label>密码：</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="submit-btn">登录</button>
        </form>
    </div>

    <div class="register-link">
        还没有账号？<a href="{% url 'register' %}">点击注册</a>
    </div>
</div>

<script>
function showForm(type) {
    document.getElementById('studentBtn').classList.remove('active');
    document.getElementById('teacherBtn').classList.remove('active');
    document.getElementById(type+'Btn').classList.add('active');
    document.getElementById('studentForm').classList.remove('active');
    document.getElementById('teacherForm').classList.remove('active');
    document.getElementById(type+'Form').classList.add('active');
}
</script>
{% endblock %}
